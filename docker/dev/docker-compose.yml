# Development PostgreSQL Database
# postgresql://postgres:Passord01@localhost:6789/postgres

services:
    postgres:
        container_name: kulturguide-dev
        image: pgvector/pgvector:pg15
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: Passord01
            POSTGRES_DB: postgres
        ports:
            - "${POSTGRES_PORT:-6789}:5432"
        volumes:
            - kulturguide-dev:/var/lib/postgresql/data

volumes:
    kulturguide-dev:
