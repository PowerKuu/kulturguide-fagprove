services:
    postgres:
        image: pgvector/pgvector:pg15
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./docker/pgvector.sql:/docker-entrypoint-initdb.d/pgvector.sql
        command:
            - "postgres"
            - "-c"
            - "wal_level=logical"
            - "-c"
            - "max_replication_slots=10"
            - "-c"
            - "max_wal_senders=10"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 5
        ports:
            - "${POSTGRES_PORT:-8765}:5432"
    kulturguide-app:
        build:
            context: ./app
            dockerfile: Dockerfile
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            NODE_ENV: production
            DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
        volumes:
            - ./models:/models
            - uploads:/app/.next/standalone/uploads
        logging:
            driver: "local"
            options:
                max-size: "10m"
                max-file: "5"
                compress: "false"
        networks:
            - default
            - proxy
    kulturguide-dozzle:
        image: amir20/dozzle:latest
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - ./app/dozzle-users.yml:/data/users.yml:ro
        environment:
            DOZZLE_AUTH_PROVIDER: simple
            DOZZLE_ENABLE_ACTIONS: "true"
            DOZZLE_NO_ANALYTICS: "true"
        networks:
            - default
            - proxy

networks:
    proxy:
        external: true

volumes:
    postgres-data:
    uploads:
